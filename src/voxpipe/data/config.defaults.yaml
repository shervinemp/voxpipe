llm:
  backend: "local"
  model: "Gemma4_12B"
  max_tool_iterations: 1
  max_turns: 10
  tool_timeout: 10

  local:
    Qwen3:
      n_ctx: 40960
      max_tokens: 8192
      decoder: "legacy_xml"

    Gemma4E2B: &gemma4
      n_ctx: 8192
      max_tokens: 2048
      type_k: "q4_0"
      type_v: "q4_0"
      decoder: "gemma_e2b"

    Gemma4E4B: *gemma4

    Gemma4_12B:
      <<: *gemma4
      decoder: "legacy_xml"

  litellm:
    provider: "ollama"
    model: "qwen3:latest"
    api_base: "http://localhost:11434"
    timeout: 60
    max_tokens: 1024

hotkeys:
  enable: true
  push_to_talk: null
  press_to_reset: null

tts:
  provider: "Kokoro"
  weights_dir: "model_files/tts"

asr:
  provider: "ParakeetV2"
  weights_dir: "model_files/asr"
  sound_device: null
  vad_threshold: 0.4
  trailing_silence_ms: 800
  leading_silence_ms: 1000
  max_segment_duration: 0
  crisperwhisper:
    model: "nyralabs/CrisperWhisper2.0_small"
    backend: "auto"
    mode: "verbatim"
    language: "en"

conversation_history:
  enabled: true
  db_path: "data/conversations.db"
  max_entries: 1000
  top_k: 2
  ttl_days: 30

topic_tracking:
  enabled: false
  backend: "lexical"        # "lexical" (no extra packages), "embedding" (fastembed), or "laya"
  threshold: null           # null = the backend's default; 0..1 in the scorer's own scale
  ttl_sentences: 10         # unused side buffers are dropped after this many utterances
  max_unrelated: 4          # side buffers kept at once (least recently used goes first)
  history_sentences: 8      # recent utterances of a buffer compared with the new sentence
  promote_after: 0          # consecutive side utterances before it becomes the active topic; 0 = never
  embedding_model: "BAAI/bge-small-en-v1.5"
  embedding_cache_dir: null
  laya_model: "auto"        # "auto", "english", "multilingual" or "typed-decisions"
  laya_device: null
  laya_preload: false
  laya_max_len: 1024

attention:
  busy_mode: false
  enabled: false
  defer_ms: null            # busy_mode fills in 400 ms; explicit sets the wait
  speak_threshold: null     # busy_mode fills in 0.70
  silence_threshold: null   # busy_mode fills in 0.35
  embedding_model: "BAAI/bge-small-en-v1.5"
  embedding_cache_dir: null
  examples_path: "data/addressee_examples.jsonl"
  decision_log_path: null   # set a path (or enable shadow) to log decisions
  shadow: false
  customer_ttl_sentences: 50
  background_ttl_sentences: 10
  max_examples: 1000
  k_neighbors: 5

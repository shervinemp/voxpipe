[project]
name = "voxpipe"
dynamic = ["version"]
description = "Modular voice pipeline: ASR, LLM tool calling, streaming TTS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.4,<3",
    "pydantic>=2.10,<3",
    "pynput~=1.7.6",
    "python-dotenv~=1.1.1",
    "pyyaml~=6.0.2",
    "requests>=2.32,<3",
    "sounddevice~=0.5.2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/shervinemp/voxpipe"
Issues = "https://github.com/shervinemp/voxpipe/issues"

[project.scripts]
voxpipe = "voxpipe.__main__:main"

[project.optional-dependencies]
asr = ["onnx-asr~=0.6.1", "onnxruntime~=1.22.1"]
crisperwhisper = ["crisperwhisper[transformers]>=2.0.1,<3"]
tts = ["huggingface-hub~=0.32.6", "kokoro-onnx~=0.4.9"]
gguf = ["huggingface-hub~=0.32.6", "llama-cpp-python>=0.3.16"]
litellm = ["litellm~=1.92.0"]
embed = ["fastembed>=0.4,<1"]
laya = ["laya>=0.4.12,<0.5"]
all = ["voxpipe[asr,tts,gguf,litellm,crisperwhisper,embed]"]
dev = ["pytest>=8,<9", "soundfile~=0.13.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "voxpipe.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["voxpipe*"]

[tool.setuptools.package-data]
voxpipe = ["py.typed", "data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = "test_*.py"
markers = [
    "integration: needs downloaded model weights; run with `pytest -m integration`",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
files = ["src/voxpipe"]
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]

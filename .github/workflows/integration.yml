name: Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"  # weekly, Sunday 03:00 UTC

jobs:
  synthetic-scenario:
    name: Synthetic multi-voice attention scenario
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install system audio libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libportaudio2 espeak-ng

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: |
            model_files/tts
            ~/.cache/huggingface
            ~/.cache/fastembed
          key: integration-models-${{ runner.os }}-${{ hashFiles('src/voxpipe/data/manifest.yaml') }}

      - name: Install optional runtime extras
        run: uv sync --locked --extra dev --extra asr --extra tts --extra embed

      - name: Pre-download TTS weights
        run: uv run python -m voxpipe.tts.download

      - name: Pre-download ASR weights
        run: |
          uv run python -c "from onnx_asr import load_model; load_model('nemo-parakeet-tdt-0.6b-v2', quantization='int8')"

      - name: Pre-download embedding model
        run: |
          uv run python -c "from fastembed import TextEmbedding; TextEmbedding(model_name='BAAI/bge-small-en-v1.5')"

      - name: Run the generated-voice mixed-audio scenario
        run: uv run pytest src/tests/pipeline/test_restaurant_scenario.py -m integration -v
